<!-- Pantalla de Carga / Splash Screen -->
<div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease;">
    <!-- Aquí colocas tu imagen de NOVACALC (guarda tu imagen en el repositorio como 'novacalc-bg.png' o similar) -->
    <img src="novacalc-bg.png" style="width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1;" alt="NOVACALC">
    
    <!-- Texto del porcentaje flotando abajo o en el centro -->
    <div id="loading-percentage" style="position: relative; z-index: 2; color: #ff7700; font-size: 32px; font-weight: bold; margin-top: auto; margin-bottom: 50px; text-shadow: 0 0 10px rgba(0,0,0,0.8);">
        1%
    </div>
</div>
