<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NovaCalc</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0b0d;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            height: 100%;
            max-width: 450px;
            max-height: 900px;
            position: relative;
            background: #000000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Fondo con la imagen artística */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Pantalla Splash & Loading */
        .splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease;
        }

        .splash-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 80%;
            margin-top: -40px;
        }

        .calc-logo-box {
            width: 110px;
            height: 140px;
            border: 3px solid #FF8C00;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 12px;
            box-shadow: 0 0 25px rgba(255, 140, 0, 0.7), inset 0 0 15px rgba(255, 140, 0, 0.4);
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.3);
        }

        .calc-screen-sim {
            width: 80px;
            height: 32px;
            border: 2px solid #FF8C00;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
        }

        .calc-grid-sim {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            width: 80px;
        }

        .calc-btn-sim {
            height: 14px;
            background: #FF8C00;
            border-radius: 3px;
            box-shadow: 0 0 5px rgba(255, 140, 0, 0.6);
        }

        .brand-title {
            color: #ffffff;
            font-size: 34px;
            letter-spacing: 6px;
            font-weight: 300;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
        }

        /* Barra de carga */
        .loading-container {
            width: 100%;
            height: 12px;
            background: rgba(20, 20, 20, 0.7);
            border: 2px solid rgba(255, 140, 0, 0.5);
            border-radius: 10px;
            margin-top: 50px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.3);
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff6600, #ffaa00);
            box-shadow: 0 0 15px #FF8C00;
            border-radius: 8px;
            transition: width 0.05s linear;
        }

        .loading-text {
            color: #FF8C00;
            font-size: 17px;
            margin-top: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        /* Pantalla de la Calculadora Profesional Funcional */
        .calculator-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 25px 20px;
        }

        .calc-glass-panel {
            width: 100%;
            background: rgba(15, 15, 18, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 140, 0, 0.25);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            margin-bottom: 15px;
        }

        .calc-header-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .mini-logo {
            width: 22px;
            height: 22px;
            border: 1.5px solid #FF8C00;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #FF8C00;
            box-shadow: 0 0 8px rgba(255, 140, 0, 0.4);
        }

        .calculator-display {
            width: 100%;
            color: #FF8C00;
            font-size: 48px;
            text-align: right;
            font-weight: 400;
            word-break: break-all;
            word-wrap: break-word;
            text-shadow: 0 0 15px rgba(255, 140, 0, 0.3);
            min-height: 65px;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
        }

        .calculator-keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
        }

        .calc-btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            font-weight: 400;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s, filter 0.2s;
            outline: none;
        }

        .calc-btn:active {
            transform: scale(0.93);
            filter: brightness(1.3);
        }

        .btn-gray {
            background-color: rgba(40, 40, 44, 0.85);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-light-gray {
            background-color: rgba(165, 165, 167, 0.85);
            color: #000000;
            font-weight: 500;
        }

        .btn-orange {
            background-color: #FF8C00;
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4);
        }

        .btn-zero {
            grid-column: span 2;
            aspect-ratio: auto;
            border-radius: 40px;
            justify-content: flex-start;
            padding-left: 32px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- REEMPLAZA 'novacalc-bg.png' POR EL NOMBRE EXACTO DE TU IMAGEN EN GITHUB -->
        <img src="novacalc-bg.png" class="bg-image" alt="Fondo NovaCalc">

        <!-- PANTALLA SPLASH & LOADING -->
        <div id="splash-screen" class="splash-screen">
            <div class="splash-content">
                <div class="calc-logo-box">
                    <div class="calc-screen-sim"></div>
                    <div class="calc-grid-sim">
                        <div class="calc-btn-sim"></div>
                        <div class="calc-btn-sim"></div>
                        <div class="calc-btn-sim"></div>
                        <div class="calc-btn-sim"></div>
                        <div class="calc-btn-sim"></div>
                        <div class="calc-btn-sim"></div>
                        <div class="calc-btn-sim"></div>
                        <div class="calc-btn-sim"></div>
                    </div>
                </div>
                <h1 class="brand-title">NOVACALC</h1>
                
                <div class="loading-container">
                    <div id="loading-bar" class="loading-bar"></div>
                </div>
                <div id="loading-text" class="loading-text">1% Loading</div>
            </div>
        </div>

        <!-- CALCULADORA FUNCIONAL -->
        <div class="calculator-container">
            <div class="calc-glass-panel">
                <div class="calc-header-brand">
                    <div class="mini-logo">N</div> NovaCalc
                </div>
                <div id="display" class="calculator-display">0</div>
            </div>

            <div class="calculator-keypad">
                <button class="calc-btn btn-light-gray" onclick="clearCalc()">AC</button>
                <button class="calc-btn btn-light-gray" onclick="appendOperator('±')">±</button>
                <button class="calc-btn btn-light-gray" onclick="appendOperator('%')">%</button>
                <button class="calc-btn btn-orange" onclick="appendOperator('÷')">÷</button>
                
                <button class="calc-btn btn-gray" onclick="appendNumber('7')">7</button>
                <button class="calc-btn btn-gray" onclick="appendNumber('8')">8</button>
                <button class="calc-btn btn-gray" onclick="appendNumber('9')">9</button>
                <button class="calc-btn btn-orange" onclick="appendOperator('×')">×</button>
                
                <button class="calc-btn btn-gray" onclick="appendNumber('4')">4</button>
                <button class="calc-btn btn-gray" onclick="appendNumber('5')">5</button>
                <button class="calc-btn btn-gray" onclick="appendNumber('6')">6</button>
                <button class="calc-btn btn-orange" onclick="appendOperator('-')">-</button>
                
                <button class="calc-btn btn-gray" onclick="appendNumber('1')">1</button>
                <button class="calc-btn btn-gray" onclick="appendNumber('2')">2</button>
                <button class="calc-btn btn-gray" onclick="appendNumber('3')">3</button>
                <button class="calc-btn btn-orange" onclick="appendOperator('+')">+</button>
                
                <button class="calc-btn btn-gray btn-zero" onclick="appendNumber('0')">0</button>
                <button class="calc-btn btn-gray" onclick="appendNumber('.')">.</button>
                <button class="calc-btn btn-orange" onclick="calculate()">=</button>
            </div>
        </div>

    </div>

    <script>
        let currentInput = "0";
        let isResultDisplayed = false;

        // Secuencia de animación de carga al abrir la app
        window.addEventListener('DOMContentLoaded', () => {
            const splashScreen = document.getElementById('splash-screen');
            const loadingBar = document.getElementById('loading-bar');
            const loadingText = document.getElementById('loading-text');

            let percentage = 1;
            
            // 2 segundos estáticos iniciales
            setTimeout(() => {
                let loadInterval = setInterval(() => {
                    if (percentage <= 100) {
                        loadingBar.style.width = percentage + "%";
                        loadingText.innerText = percentage + "% Loading";
                        percentage++;
                    } else {
                        clearInterval(loadInterval);
                        splashScreen.style.opacity = '0';
                        setTimeout(() => {
                            splashScreen.style.display = 'none';
                        }, 600);
                    }
                }, 40); // Llega al 100% en 4 segundos exactos
            }, 2000);
        });

        function updateDisplay() {
            const displayElement = document.getElementById('display');
            if (displayElement) {
                displayElement.innerText = currentInput;
            }
        }

        function appendNumber(num) {
            if (isResultDisplayed) {
                currentInput = num;
                isResultDisplayed = false;
            } else {
                if (currentInput === "0") {
                    currentInput = num;
                } else {
                    currentInput += num;
                }
            }
            updateDisplay();
        }

        function appendOperator(op) {
            isResultDisplayed = false;

            if (op === '±') {
                if (currentInput.startsWith('-')) {
                    currentInput = currentInput.slice(1);
                } else if (currentInput !== "0") {
                    currentInput = '-' + currentInput;
                }
                updateDisplay();
                return;
            }

            if (op === '%') {
                try {
                    let val = parseFloat(currentInput) / 100;
                    currentInput = String(val);
                    updateDisplay();
                } catch (e) {
                    currentInput = "Error";
                    updateDisplay();
                }
                return;
            }

            // Evita acumular operadores seguidos
            let lastChar = currentInput.trim().slice(-1);
            if (['+', '-', '×', '÷'].includes(lastChar)) {
                currentInput = currentInput.trim().slice(0, -1) + " " + op + " ";
            } else {
                currentInput += " " + op + " ";
            }
            updateDisplay();
        }

        function clearCalc() {
            currentInput = "0";
            isResultDisplayed = false;
            updateDisplay();
        }

        function calculate() {
            try {
                // Traduce los símbolos visuales a operaciones válidas de JavaScript
                let evalString = currentInput
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/');

                let result = eval(evalString);
                
                // Evita decimales infinitos larguísimos
                if (!Number.isInteger(result)) {
                    result = parseFloat(result.toFixed(6));
                }

                currentInput = String(result);
                isResultDisplayed = true;
                updateDisplay();
            } catch (e) {
                currentInput = "Error";
                updateDisplay();
                setTimeout(clearCalc, 1200);
            }
        }
    </script>
</body>
</html>
