<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novacalc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Pantalla de Carga / Splash Screen (4 segundos, del 1% al 100%) -->
    <div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease;">
        <!-- CAMBIA 'novacalc-bg.png' por el nombre exacto de tu imagen en GitHub (ej: 'foto.jpg', 'logo.png') -->
        <img src="novacalc-bg.png" style="width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1;" alt="NOVACALC">
        
        <!-- Porcentaje flotando -->
        <div id="loading-percentage" style="position: relative; z-index: 2; color: #ff7700; font-size: 36px; font-weight: bold; margin-top: auto; margin-bottom: 60px; text-shadow: 0 0 10px rgba(0,0,0,0.9);">
            1%
        </div>
    </div>

    <!-- Pantalla Principal de la Calculadora -->
    <div id="calc-app" class="calculator-container">
        <div id="display" class="calculator-display">0</div>
        <div class="calculator-keypad">
            <button onclick="clearCalc()">C</button>
            <button onclick="appendOperator('⌫')">⌫</button>
            <button onclick="appendOperator('%')">%</button>
            <button onclick="appendOperator('÷')">÷</button>
            
            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button onclick="appendOperator('×')">×</button>
            
            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button onclick="appendOperator('-')">-</button>
            
            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button onclick="appendOperator('+')">+</button>
            
            <button onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button onclick="calculate()">=</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
